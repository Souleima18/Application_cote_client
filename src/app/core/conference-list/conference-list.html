<h1>Liste des Conférences</h1>
<input type="text" placeholder="Rechercher une conférence" [(ngModel)]="searchItem">{{searchItem}}
<div class="container" style="display: flex; flex-wrap: wrap; gap: 16px;"> 
    @for(conf of filter();track conf.id){
        @if(conf.nbPlaces > 0){
            <app-card [conf]="conf"></app-card>
        }
}@empty {
    <h2>Aucune conférence disponible pour le moment</h2>
}

</div>
<div>
    <h2>Liste des Favoris</h2>
    <ul>
        @for(conf of favoriteList();track conf.id){
            <li>{{conf.titre}}</li>
        }
    </ul>
</div>
<h1>{{x()}}</h1>
